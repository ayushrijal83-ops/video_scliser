{% extends "base.html" %}
{% block title %}{{ title }} - Local AI Video Clipper{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p class="error" role="alert">{{ message }}</p>
{% if job %}<p class="note">Video: {{ job.original_name }}. The uploaded file and any partial clips were removed.</p>{% endif %}
<p><a href="{{ url_for('index') }}">Back to the form</a></p>
{% endblock %}
